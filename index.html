<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avanza Constructores | Andares doce</title>
<style>
:root{--bg:#f2f4f5;--surface:#fff;--ink:#12252c;--mute:#5d6f76;--line:#d3dce0;--navy:#12313b;--red:#c8261a;--pend:#c5cdd1;--arm:#f0ae2e;--ent:#3a7fc1;--fun:#2e9d62;--col:#1c3640;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d181d;--surface:#15272f;--ink:#e8eff1;--mute:#96a9b0;--line:#2a424b;--navy:#091216;--pend:#4a5f67;--col:#05090b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d181d;--surface:#15272f;--ink:#e8eff1;--mute:#96a9b0;--line:#2a424b;--navy:#091216;--pend:#4a5f67;--col:#05090b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:4px solid var(--red)}
header img{height:64px;width:auto;background:#fff;border-radius:8px;padding:4px}
h1{margin:0;font-size:clamp(18px,3.2vw,28px);font-weight:700;letter-spacing:.2px}
header p{margin:2px 0 0;color:#b9c9ce;font-size:15px}
.wrap{max-width:1200px;margin:0 auto;padding:16px 16px 40px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:10px 18px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
button:focus-visible,input:focus-visible,.el:focus-visible{outline:3px solid var(--ent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.stat small{color:var(--mute);display:block}
.stat b{font-size:22px}
.bar{height:8px;background:var(--line);border-radius:4px;margin-bottom:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--fun);width:0;transition:width .3s}
.main{display:grid;grid-template-columns:1fr 310px;gap:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.scroll{overflow-x:auto}
svg{display:block;width:100%;min-width:600px;height:auto}
.grid{stroke:var(--mute);stroke-width:1;stroke-dasharray:7 5;opacity:.6}
.bub{fill:var(--surface);stroke:var(--mute)}
.btxt{fill:var(--ink);font-size:20px;text-anchor:middle;dominant-baseline:central}
.el{cursor:pointer}
.el .foot{fill:var(--pend);stroke:var(--navy);stroke-width:2;transition:fill .2s}
.el.armado .foot{fill:var(--arm)}.el.entarimado .foot{fill:var(--ent)}.el.fundido .foot{fill:var(--fun)}
.el .col{fill:var(--col)}
.el:hover .foot{stroke:var(--red)}
.el.sel .foot{stroke:var(--red);stroke-width:4}
.lbl{fill:var(--ink);font-size:20px;font-weight:600}
.vol{fill:var(--mute);font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;color:var(--mute);font-size:13px}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--pend)}
.dot.armado{background:var(--arm)}.dot.entarimado{background:var(--ent)}.dot.fundido{background:var(--fun)}
.panel h2{margin:0;font-size:26px}
.panel .tipo{color:var(--mute)}
.big{font-size:34px;font-weight:700;margin:8px 0 2px}
.status{margin-bottom:12px;font-weight:600}
.steps{display:grid;gap:6px}
.steps button{display:flex;align-items:center;gap:8px;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;border-radius:8px;padding:9px 12px;cursor:pointer}
.steps button[aria-pressed="true"]{border-color:var(--red)}
label.f{display:block;margin-top:12px;color:var(--mute);font-size:13px}
input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 8px;width:100%}
.hint{color:var(--mute);font-size:13px;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:4px 12px;font:inherit;cursor:pointer}
.chip.sel{border-color:var(--red)}
h3{margin:18px 0 8px;font-size:16px}
table{width:100%;border-collapse:collapse}
th,td{padding:6px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600;font-size:13px}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
.tw td input{min-width:78px}
.tw td:first-child input{min-width:90px}
.btn{border:0;background:var(--red);color:#fff;font:inherit;font-weight:600;border-radius:8px;padding:9px 16px;cursor:pointer}
.btn.ghost{background:none;color:var(--mute);padding:4px 10px;font-size:18px}
.empty{color:var(--mute)}.row2{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}.row2 label{flex:1;min-width:180px;margin:0}.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.item{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}.ih{display:flex;justify-content:space-between;font-size:17px}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px;font-size:14px}.meta small{display:block;color:var(--mute)}.el.dim{opacity:.28}#svg3 .el{cursor:default}#svg3 .el:hover .foot{stroke:var(--navy)}.rh{display:flex;align-items:center;gap:14px;margin-bottom:14px}.rh img{height:70px;background:#fff;border-radius:8px;padding:4px}.rh h2{margin:0;font-size:22px}.rh p{margin:2px 0 0;color:var(--mute)}.sync{margin-left:auto;font-size:12px;color:#b9c9ce;text-align:right;max-width:170px}h3:first-child{margin-top:0}@media (max-width:860px){.meta{grid-template-columns:1fr 1fr}}
@media (max-width:860px){.main{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}header img{height:52px}}
</style></head><body>

const et=n=>(S.est[n]&&S.est[n].e)||"pendiente";
const E=n=>S.est[n]||{};

function setSync(m){$("sync").textContent={live:"Compartido: los cambios se sincronizan entre equipos",local:"Sin conexión compartida: guardado solo en este navegador",err:"No se pudo guardar, revisa tu conexión",wait:"Conectando…"}[m]}
function setv(path,v){let o=S;pend=pend||{};let p=pend;path.forEach((k,i)=>{if(i===path.length-1){o[k]=v;p[k]=v}else{o[k]=o[k]||{};p[k]=p[k]||{};o=o[k];p=p[k]}});schedule()}
function schedule(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!ref)return;clearTimeout(timer);timer=setTimeout(flush,700)}
async function flush(){if(writing||!pend)return;const p=pend;pend=null;writing=true;try{if(!exists){await ref.set(S);exists=true}else await ref.update(p);setSync("live")}catch(e){setSync("err")}writing=false;if(pend)schedule();else try{snap(await ref.get())}catch(e){}}
function snap(s){if(pend||writing)return;if(s.exists){S=merge(clone(DEF),s.data());exists=true}renderAll(true)}

function planSVG(inter,day){
 let h="";
 Object.entries(GX).forEach(([k,x])=>{h+=`<line class="grid" x1="${x}" y1="100" x2="${x}" y2="650"/><circle class="bub" cx="${x}" cy="70" r="17"/><text class="btxt" x="${x}" y="71">${k}</text>`});
 Object.entries(GY).forEach(([k,y])=>{h+=`<line class="grid" x1="0" y1="${y}" x2="1200" y2="${y}"/><circle class="bub" cx="38" cy="${y}" r="17"/><text class="btxt" x="38" y="${y+1}">${k}</text>`});
 const cls=id=>`el ${et(id)} ${inter&&sel===id?"sel":""} ${day&&!(et(id)==="fundido"&&E(id).f===day)?"dim":""}`;
 const at=id=>inter?`data-id="${id}" tabindex="0" role="button" aria-label="${id}"`:"";
 P.forEach(([id,x,y,w,hh])=>{const l=LB[y];h+=`<g class="${cls(id)}" ${at(id)}><rect class="foot" x="${x-35}" y="${y-40}" width="70" height="80"/><rect class="col" x="${x-w/2}" y="${y-hh/2}" width="${w}" height="${hh}"/><text class="lbl" x="${x+l[0]}" y="${y+l[1]}">${id}</text><text class="vol" x="${x+l[0]}" y="${y+l[1]+(l[1]<0?-18:18)}">${fmt(vol(id))} m³</text></g>`});
 Object.entries(M).forEach(([id,m])=>{const d='stroke="var(--navy)" stroke-dasharray="4 3"';
  h+=`<g class="${cls(id)}" ${at(id)}><path class="foot" d="${m.d}"/><rect x="${m.x[0]}" y="${m.x[1]}" width="${m.x[2]-m.x[0]}" height="${m.x[3]-m.x[1]}" fill="none" ${d}/><line x1="${m.x[0]}" y1="${m.x[1]}" x2="${m.x[2]}" y2="${m.x[3]}" ${d}/><line x1="${m.x[0]}" y1="${m.x[3]}" x2="${m.x[2]}" y2="${m.x[1]}" ${d}/>${m.l.map(q=>`<line x1="${q[0]}" y1="${q[1]}" x2="${q[2]}" y2="${q[3]}" stroke="var(--col)" stroke-width="10"/>`).join("")}<text class="lbl" x="${m.lx}" y="${m.ly}">${id}</text><text class="vol" x="${m.lx+36}" y="${m.ly}">${fmt(vol(id))} m³</text></g>`});
 return h;
}
function plan(){$("svg").innerHTML=planSVG(true)}
function stats(){
 let tot=0,fun=0,ent=0,w=0;const cnt={pendiente:0,armado:0,entarimado:0,fundido:0};
 ALL.forEach(n=>{const v=vol(n),e=et(n);tot+=v;w+=v*W[e];cnt[e]++;if(e==="fundido")fun+=v;if(e==="entarimado")ent+=v});
 const pct=tot?w/tot*100:0;
 $("stats").innerHTML=[["Total de concreto"+(S.level?" · "+esc(S.level):""),fmt(tot)+" m³"],["m³ fundidos",fmt(fun)+" m³"],["m³ por fundir (entarimado)",fmt(ent)+" m³"],["Avance",pct.toFixed(1)+" %"]].map(a=>`<div class="stat"><small>${a[0]}</small><b>${a[1]}</b></div>`).join("");
 $("bar").style.width=pct+"%";
 $("legend").innerHTML=ETAPAS.map(([k,t])=>`<span><i class="dot ${k}"></i>${t}: ${cnt[k]}</span>`).join("")+`<span>Avance: armado 45 %, entarimado 80 %, fundido 100 %</span>`;
}
function reg(){
 const f=ALL.filter(n=>et(n)==="fundido").sort((a,b)=>(E(a).f||"").localeCompare(E(b).f||""));
 $("reg").innerHTML=f.length?`<table>${f.map(n=>`<tr><td>${fecha(E(n).f)}</td><td>${n}</td><td class="n">${fmt(vol(n))} m³</td></tr>`).join("")}</table>`:`<p class="empty">Aún no hay elementos fundidos.</p>`;
}
const stText=n=>({pendiente:"Sin iniciar",armado:"En armado",entarimado:"Entarimado listo · por fundir",fundido:"Fundido el "+fecha(E(n).f)})[et(n)];
function panel(){
 const p=$("panel");
 if(!sel){p.innerHTML=`<p class="empty">Selecciona una columna o un muro en el plano para ver su concreto, cambiar su etapa y registrar su fundición.</p>`;return}
 const n=sel,e=et(n),f=(k,t,ph,ty)=>`<label class="f">${t}<input ${ty?`type="${ty}"`:""} data-p="est.${n}.${k}" value="${esc(E(n)[k]||"")}" ${ph?`placeholder="${ph}"`:""}></label>`;
 p.innerHTML=`<h2>${n}</h2><div class="tipo">${n[0]==="M"?"Muro":"Columna"}</div><div class="big" id="pv">${fmt(vol(n))} m³</div><div class="status" id="pst">${stText(n)}</div>
 <div class="steps">${ETAPAS.map(([k,t])=>`<button data-e="${k}" aria-pressed="${e===k}"><i class="dot ${k}"></i>${t}</button>`).join("")}</div>
 <h3>Datos de fundición</h3><div class="g2">${f("f","Fecha de fundición","","date")}${f("g","No. de guía del camión")}${f("r","Revenimiento (slump)","cm")}${f("t","Temperatura del concreto","°C")}</div>${f("c","Tipo de concreto","Ej. 280 kg/cm²")}`;
}
function table(){
 $("tb").innerHTML=CIDS.map(n=>`<tr><td><b>${n}</b></td>${["l","a","h"].map(k=>`<td><input data-p="dims.${n}.${k}" inputmode="decimal" value="${esc(S.dims[n][k])}"></td>`).join("")}<td class="n" data-v="${n}"></td></tr>`).join("");
 $("mw").innerHTML=["M1","M2"].map(n=>`<div class="card" style="margin-top:14px"><h3>${n}</h3><div class="tw"><table><thead><tr><th>Descripción</th><th>Pzas</th><th>Largo (m)</th><th>Ancho (m)</th><th class="n">m²</th></tr></thead><tbody>${["k1","k2","k3"].map(k=>`<tr><td>${S.muros[n].k[k].d}</td>${["p","l","a"].map(c=>`<td><input data-p="muros.${n}.k.${k}.${c}" inputmode="decimal" value="${esc(S.muros[n].k[k][c])}"></td>`).join("")}<td class="n" data-r="${n}.${k}"></td></tr>`).join("")}</tbody>
 <tfoot><tr><th colspan="4">Suma de m²</th><th class="n" data-sum="${n}"></th></tr><tr><th colspan="3">Alto (m)</th><td><input data-p="muros.${n}.h" inputmode="decimal" value="${esc(S.muros[n].h)}"></td><th class="n" data-v="${n}"></th></tr></tfoot></table></div></div>`).join("");
}
function calc(){
 document.querySelectorAll("[data-v]").forEach(c=>c.textContent=fmt(vol(c.dataset.v))+" m³");
 document.querySelectorAll("[data-sum]").forEach(c=>c.textContent=fmt(msum(c.dataset.sum))+" m²");
 document.querySelectorAll("[data-r]").forEach(c=>{const[n,k]=c.dataset.r.split("."),r=S.muros[n].k[k];c.textContent=fmt(num(r.p)*num(r.l)*num(r.a))+" m²"});
 $("tc").textContent=fmt(CIDS.reduce((s,n)=>s+vol(n),0))+" m³";
}
function day(){
 const d=cd();$("svg3").innerHTML=planSVG(false,d);
 const L=ALL.filter(n=>et(n)==="fundido"&&E(n).f===d).sort((a,b)=>(E(a).g||"").localeCompare(E(b).g||"",undefined,{numeric:true})||a.localeCompare(b,undefined,{numeric:true}));
 const x=v=>v?esc(v):"—";
 if(!L.length){$("dl").innerHTML=$("dt").innerHTML=`<p class="empty">No hay elementos fundidos el ${fecha(d)}.</p>`;return}
 $("dl").innerHTML=L.map(n=>{const e=E(n);return `<div class="item"><div class="ih"><b>${n}</b><span>${fmt(vol(n))} m³</span></div><div class="meta"><span><small>No. de guía</small>${x(e.g)}</span><span><small>Revenimiento</small>${x(e.r)}</span><span><small>Temperatura</small>${x(e.t)}</span><span><small>Tipo de concreto</small>${x(e.c)}</span></div></div>`}).join("");
 const t=L.reduce((s,n)=>s+vol(n),0);
 $("dt").innerHTML=`<table><thead><tr><th>Elemento</th><th class="n">m³</th><th>No. de guía</th><th>Tipo de concreto</th></tr></thead><tbody>${L.map(n=>`<tr><td>${n}</td><td class="n">${fmt(vol(n))}</td><td>${x(E(n).g)}</td><td>${x(E(n).c)}</td></tr>`).join("")}</tbody><tfoot><tr><th>Total · ${L.length} elementos</th><th class="n">${fmt(t)} m³</th><th></th><th></th></tr></tfoot></table>`;
}
function sync(){document.querySelectorAll("[data-p]").forEach(i=>{if(i!==document.activeElement){const v=String(val(i.dataset.p));if(i.value!==v)i.value=v}})}
function renderAll(remote){plan();stats();reg();day();calc();if(!(remote&&$("panel").contains(document.activeElement)))panel();sync()}
function after(){calc();stats();plan();reg();day();if(sel){$("pv").textContent=fmt(vol(sel))+" m³";$("pst").textContent=stText(sel)}sync()}

document.addEventListener("input",e=>{const p=e.target.dataset&&e.target.dataset.p;if(p){setv(p.split("."),e.target.value);after()}});
$("svg").addEventListener("click",e=>{const g=e.target.closest(".el");if(g){sel=g.dataset.id;renderAll()}});
$("svg").addEventListener("keydown",e=>{const g=e.target.closest(".el");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();sel=g.dataset.id;renderAll()}});
$("panel").addEventListener("click",e=>{const b=e.target.closest("[data-e]");if(!b)return;const k=b.dataset.e;setv(["est",sel,"e"],k);if(k==="fundido"&&!E(sel).f)setv(["est",sel,"f"],cd());renderAll()});
function tab(n){[1,2,3].forEach(i=>{$("p"+i).hidden=i!==n;$("t"+i).setAttribute("aria-selected",i===n)});renderAll()}
[1,2,3].forEach(i=>$("t"+i).onclick=()=>tab(i));
table();renderAll();
(async()=>{try{const db=window.claude&&await claude.use("db");if(db){ref=db.doc("obra/estado");setSync("wait");ref.onSnapshot(snap,()=>{ref=null;setSync("local")});setSync("live");return}}catch(e){}setSync("local")})();
</script></body></html>
